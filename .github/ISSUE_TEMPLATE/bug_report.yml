name: Bug report
description: Report a defect in AgentLens
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a repository link that reproduces the issue.
      placeholder: |
        1. Install `@agentlensjs/vite-plugin` ...
        2. Run `vite dev` ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Affected package(s) and version(s)
      placeholder: '@agentlensjs/mcp-server@0.1.0'
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `npx envinfo --system --binaries --browsers`
      render: shell
