name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
    # Each package must have this repo + workflow registered as its
    # Trusted Publisher on npmjs.com (Settings -> Trusted Publisher).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: 'chore: 发布版本'
          title: 'chore: 发布版本'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
